services:
  web:
    build: .
    ports:
      - "8080:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: senha123
      DB_NAME: meubanco
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: meubanco
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql-data:
